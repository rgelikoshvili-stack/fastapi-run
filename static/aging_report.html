<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bridge Hub — Aging Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/bh.css">
<style>
.buckets{display:grid;grid-template-columns:repeat(5,1fr);gap:.85rem;margin-bottom:1.5rem}
.bucket{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.25rem;text-align:center;border-top:3px solid var(--line-strong)}
.bucket.current{border-top-color:var(--green)}
.bucket.b31{border-top-color:var(--amber)}
.bucket.b61{border-top-color:#c87c28}
.bucket.b91{border-top-color:var(--red)}
.bucket.over{border-top-color:var(--purple)}
.bucket-val{font-size:1.3rem;font-weight:700;margin:.25rem 0;font-family:var(--mono);color:var(--ink)}
.bucket-label{font-size:.72rem;color:var(--ink-dim);margin-bottom:.2rem;font-family:var(--mono)}
.bucket-cnt{font-size:.72rem;color:var(--ink-ghost)}
.total-bar{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.25rem;background:var(--ink);color:var(--paper);border-radius:var(--r);margin-bottom:1.25rem;font-weight:600;font-family:var(--mono)}
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:1.5rem;background:var(--card);border-radius:var(--r) var(--r) 0 0;padding:.5rem .5rem 0}
.tab-item{padding:.68rem 1.25rem;cursor:pointer;font-size:.9rem;font-weight:500;color:var(--ink-dim);border-bottom:2px solid transparent;margin-bottom:-2px;border-radius:6px 6px 0 0}
.tab-item.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
.tab-pane{display:none}.tab-pane.active{display:block}
@media(max-width:900px){.buckets{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.buckets{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar-mount"></aside>
<div class="main">
  <div class="topbar">
    <div class="crumbs">Bridge Hub <span class="sep">/</span> <em>Aging Report</em></div>
  </div>
  <div class="content">
    <div class="page-head">
      <div>
        <div class="p-eye">RECEIVABLES</div>
        <div class="p-title">AR/AP <em>Aging Report</em></div>
        <div class="p-sub">AR/AP დავალიანების ანალიზი — bucket analysis by overdue days.</div>
      </div>
    </div>

    <div class="tab-bar">
      <div class="tab-item active" onclick="switchTab('ar',this)">AR — მიღებული</div>
      <div class="tab-item" onclick="switchTab('ap',this)">AP — გადასახდელი</div>
    </div>

    <!-- AR -->
    <div id="pane-ar" class="tab-pane active">
      <div class="card">
        <div class="card-head">
          <div class="card-title">დებიტორული დავალიანება (Accounts Receivable)</div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <input class="inp" type="date" id="arAsOf" style="width:140px"/>
            <input class="inp" type="text" id="arPartner" placeholder="კლიენტი…" style="width:160px"/>
            <button class="btn btn-primary btn-sm" onclick="loadAR()">ჩვენება</button>
          </div>
        </div>
        <div class="card-body" id="arBody">
          <div class="empty"><span class="empty-txt">აირჩიეთ თარიღი</span></div>
        </div>
      </div>
    </div>

    <!-- AP -->
    <div id="pane-ap" class="tab-pane">
      <div class="card">
        <div class="card-head">
          <div class="card-title">კრედიტორული დავალიანება (Accounts Payable)</div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <input class="inp" type="date" id="apAsOf" style="width:140px"/>
            <input class="inp" type="text" id="apPartner" placeholder="მომწოდებელი…" style="width:160px"/>
            <button class="btn btn-primary btn-sm" onclick="loadAP()">ჩვენება</button>
          </div>
        </div>
        <div class="card-body" id="apBody">
          <div class="empty"><span class="empty-txt">აირჩიეთ თარიღი</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/sidebar.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    BridgeHub.loadSidebar('aging');
});
</script>
<script>
const TOKEN=localStorage.getItem('access_token')||localStorage.getItem('bh_token')||'';
const TENANT=localStorage.getItem('tenant_id')||'';
function hdr(){return{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN,'X-Tenant-ID':TENANT};}
async function api(path){
  try{const r=await fetch(path,{headers:hdr()});return await r.json();}
  catch(e){console.error(e);return null;}
}
function fmt(n){return Number(n||0).toLocaleString('ka-GE',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

const today=new Date().toISOString().split('T')[0];
document.getElementById('arAsOf').value=today;
document.getElementById('apAsOf').value=today;

function switchTab(id,el){
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  document.getElementById('pane-'+id).classList.add('active');
  el.classList.add('active');
}

const BUCKET_CFG={
  current:{cls:'current',label:'მიმდინარე (0–30)'},
  '31_60':{cls:'b31',label:'31–60 დღე'},
  '61_90':{cls:'b61',label:'61–90 დღე'},
  '91_120':{cls:'b91',label:'91–120 დღე'},
  over_120:{cls:'over',label:'120+ დღე'},
};

function renderBuckets(buckets){
  return Object.entries(BUCKET_CFG).map(([key,cfg])=>{
    const b=buckets[key]||{amount:0,count:0};
    return `<div class="bucket ${cfg.cls}">
      <div class="bucket-label">${cfg.label}</div>
      <div class="bucket-val">₾${fmt(b.amount)}</div>
      <div class="bucket-cnt">${b.count} ანგ.</div>
    </div>`;
  }).join('');
}

function bucketBadge(bucket){
  const map={current:'chip-approved','31_60':'chip-pending','61_90':'chip-pending','91_120':'chip-danger',over_120:'chip-danger'};
  const labels={current:'მიმდინარე','31_60':'31-60','61_90':'61-90','91_120':'91-120',over_120:'120+'};
  return `<span class="chip ${map[bucket]||'chip-draft'}">${labels[bucket]||bucket}</span>`;
}

async function loadAR(){
  const asOf=document.getElementById('arAsOf').value;
  const partner=document.getElementById('arPartner').value.trim();
  let url=`/reports/aging/receivables?as_of=${asOf}`;
  if(partner) url+=`&partner=${encodeURIComponent(partner)}`;

  document.getElementById('arBody').innerHTML='<div class="empty"><span class="empty-txt">იტვირთება…</span></div>';
  const d=await api(url);
  if(!d||!d.ok){document.getElementById('arBody').innerHTML='<div class="empty"><span class="empty-txt">შეცდომა</span></div>';return;}
  const {total_outstanding,buckets,invoices}=d.data;

  const rows=invoices.map(inv=>`
    <tr>
      <td class="mono">${esc(inv.invoice_number||'—')}</td>
      <td>${esc(inv.partner||'—')}</td>
      <td class="mono">${esc(inv.issue_date||'—')}</td>
      <td class="mono">${esc(inv.due_date||'—')}</td>
      <td class="mono" style="text-align:right">₾${fmt(inv.outstanding)}</td>
      <td class="mono" style="color:${inv.days_overdue>90?'var(--red)':inv.days_overdue>30?'var(--amber)':'var(--green)'}">${inv.days_overdue} დღე</td>
      <td>${bucketBadge(inv.bucket)}</td>
      <td><span style="font-size:.78rem;color:var(--ink-dim)">${esc(inv.status)}</span></td>
    </tr>`).join('');

  document.getElementById('arBody').innerHTML=`
    <div class="total-bar">
      <span>სულ გადასაღები: ${invoices.length} ინვოისი</span>
      <span>₾${fmt(total_outstanding)}</span>
    </div>
    <div class="buckets">${renderBuckets(buckets)}</div>
    ${invoices.length?`<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>ინვ. №</th><th>კლიენტი</th><th>გამოწ. თარიღი</th><th>ვადა</th><th style="text-align:right">გადასაღები</th><th>ვადა გადაც.</th><th>კატეგორია</th><th>სტატუსი</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`:'<div class="empty"><span class="empty-txt">ვადაგადაცილებული ინვოისები არ არის</span></div>'}`;
}

async function loadAP(){
  const asOf=document.getElementById('apAsOf').value;
  const partner=document.getElementById('apPartner').value.trim();
  let url=`/reports/aging/payables?as_of=${asOf}`;
  if(partner) url+=`&partner=${encodeURIComponent(partner)}`;

  document.getElementById('apBody').innerHTML='<div class="empty"><span class="empty-txt">იტვირთება…</span></div>';
  const d=await api(url);
  if(!d||!d.ok){document.getElementById('apBody').innerHTML='<div class="empty"><span class="empty-txt">შეცდომა</span></div>';return;}
  const {total_outstanding,buckets,payables}=d.data;

  const rows=(payables||[]).map(p=>`
    <tr>
      <td>${esc(p.description||'—')}</td>
      <td>${esc(p.partner||'—')}</td>
      <td class="mono">${esc(p.issue_date||'—')}</td>
      <td class="mono" style="text-align:right">₾${fmt(p.outstanding)}</td>
      <td class="mono" style="color:${p.days_overdue>90?'var(--red)':p.days_overdue>30?'var(--amber)':'var(--green)'}">${p.days_overdue} დღე</td>
      <td>${bucketBadge(p.bucket)}</td>
      <td style="font-size:.78rem;color:var(--ink-dim)">${esc(p.account||'—')}</td>
    </tr>`).join('');

  document.getElementById('apBody').innerHTML=`
    <div class="total-bar">
      <span>სულ გადასახდელი: ${(payables||[]).length} ჩანაწერი</span>
      <span>₾${fmt(total_outstanding)}</span>
    </div>
    <div class="buckets">${renderBuckets(buckets)}</div>
    ${rows?`<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>აღწერა</th><th>მომწ./პარტნ.</th><th>თარიღი</th><th style="text-align:right">გადასახდელი</th><th>ასაკი</th><th>კატეგორია</th><th>ანგ. კოდი</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`:'<div class="empty"><span class="empty-txt">გადასახდელი დავალიანება არ არის</span></div>'}`;
}

// Auto-load AR on page load
window.addEventListener('load', loadAR);
</script>
</body>
</html>
