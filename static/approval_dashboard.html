<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bridge Hub — Approval Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/bh.css">
<style>
.queue-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px 20px;margin-bottom:12px;
  box-shadow:0 4px 16px -8px rgba(60,40,20,.1);
}
.queue-desc{font-weight:600;font-size:14px;color:var(--ink);margin-bottom:6px}
.queue-meta{font-size:12px;color:var(--ink-dim);font-family:var(--mono);line-height:1.9}
.queue-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
pre.preview-box{
  background:var(--ink);color:var(--paper);
  padding:14px;border-radius:10px;overflow:auto;white-space:pre-wrap;
  font-family:var(--mono);font-size:12px;margin-top:0;
}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar-mount"></aside>
<div class="main">
  <div class="topbar">
    <div class="crumbs">Bridge Hub <span class="sep">/</span> <em>Approval Queue</em></div>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" onclick="loadQueue()">Refresh Queue</button>
      <button class="btn btn-ghost btn-sm" onclick="clearPreview()">Clear Preview</button>
    </div>
  </div>
  <div class="content">
    <div class="page-head">
      <div>
        <div class="p-eye">WORKFLOW</div>
        <div class="p-title">Approval <em>Queue</em></div>
        <div class="p-sub">Review and action pending journal drafts.</div>
      </div>
      <div class="p-actions">
        <button class="btn btn-primary" onclick="loadQueue()">Refresh</button>
      </div>
    </div>

    <div id="queue">
      <div class="empty"><span class="empty-txt">იტვირთება…</span></div>
    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-head"><div class="card-title">Preview</div></div>
      <div class="card-body" style="padding:0">
        <pre class="preview-box" id="preview" style="margin:0;border-radius:0 0 10px 10px">No preview loaded.</pre>
      </div>
    </div>
  </div>
</div>

<!-- Reject Modal -->
<div class="modal-overlay" id="rejectModal" onclick="if(event.target===this)_closeRejectModal()">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">Reject Draft</div>
      <button class="btn btn-ghost btn-sm" onclick="_closeRejectModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--ink-dim);margin-bottom:12px">Draft #<span id="rejDraftId"></span> — provide a reason</p>
      <textarea class="inp" id="rejReason" rows="3" placeholder="Reason for rejection..." style="width:100%;resize:vertical"></textarea>
      <div style="font-size:11px;color:var(--red);margin-top:5px;min-height:15px" id="rejErr"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="_closeRejectModal()">Cancel</button>
      <button class="btn btn-danger" onclick="_confirmReject()">Reject</button>
    </div>
  </div>
</div>

<script src="/static/js/sidebar.js"></script>
<script>
BridgeHub.loadSidebar('queue');
</script>
<script>
    async function loadQueue() {
      const res = await fetch('/approval/queue');
      const data = await res.json();
      const queue = data?.data?.queue || [];
      const root = document.getElementById('queue');
      root.innerHTML = '';

      if (!queue.length) {
        root.innerHTML = '<div class="empty"><span class="empty-txt">Queue is empty.</span></div>';
        return;
      }

      queue.forEach(item => {
        const div = document.createElement('div');
        div.className = 'queue-card';

        const confidence = item.confidence ?? 'N/A';
        const status = item.status ?? 'unknown';

        div.innerHTML = `
          <div class="queue-desc">${item.description || 'No description'}</div>
          <div class="queue-meta">
            Partner: ${item.partner || 'N/A'} &nbsp;·&nbsp;
            Amount: ${item.amount ?? 'N/A'} &nbsp;·&nbsp;
            Account: ${item.account_code || 'N/A'}
          </div>
          <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
            <span class="chip chip-pending">Confidence: ${confidence}</span>
            <span class="chip chip-draft">Status: ${status}</span>
            ${!item.review_required ? '<span class="chip chip-approved">Autopilot Candidate</span>' : ''}
          </div>
          <div class="queue-actions">
            <button class="btn btn-success btn-sm" onclick="approveDraft(${item.id})">Approve</button>
            <button class="btn btn-danger btn-sm" onclick="rejectDraft(${item.id})">Reject</button>
            <button class="btn btn-ghost btn-sm" onclick='previewDraft(${JSON.stringify({
              description: item.description,
              partner: item.partner,
              amount: item.amount,
              account_code: item.account_code,
              confidence: item.confidence,
              status: item.status
            }).replace(/'/g, "&apos;")})'>Preview</button>
          </div>
        `;

        root.appendChild(div);
      });
    }

    async function approveDraft(id) {
      const res = await fetch(`/approval/approve/${id}`, { method: 'POST' });
      const data = await res.json();
      alert(data.message || 'Approved');
      loadQueue();
    }

    let _rejectId = null;
    function _openRejectModal(id){
      _rejectId = id;
      document.getElementById('rejReason').value='';
      document.getElementById('rejErr').textContent='';
      document.getElementById('rejDraftId').textContent=id;
      document.getElementById('rejectModal').classList.remove('hidden');
      document.getElementById('rejectModal').style.display='flex';
      setTimeout(()=>document.getElementById('rejReason').focus(),60);
    }
    function _closeRejectModal(){
      document.getElementById('rejectModal').style.display='none';
      _rejectId=null;
    }
    async function _confirmReject(){
      const reason = document.getElementById('rejReason').value.trim();
      if(!reason){ document.getElementById('rejErr').textContent='Enter a reason'; return; }
      const id = _rejectId;
      _closeRejectModal();
      const res = await fetch(`/approval/reject/${id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason })
      });
      const data = await res.json();
      if(!data.ok) alert(data.message || 'Error');
      loadQueue();
    }
    async function rejectDraft(id) { _openRejectModal(id); }
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') _closeRejectModal(); });

    async function previewDraft(payload) {
      const res = await fetch('/approval/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      document.getElementById('preview').textContent = JSON.stringify(data, null, 2);
    }

    function clearPreview() {
      document.getElementById('preview').textContent = 'No preview loaded.';
    }

    loadQueue();
</script>
</body>
</html>
