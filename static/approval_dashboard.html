<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bridge Hub Approval Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f7f9fc;
      color: #1f2937;
    }
    h1 {
      margin-bottom: 16px;
    }
    .toolbar {
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }
    button.secondary {
      background: #6b7280;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .meta {
      color: #6b7280;
      font-size: 14px;
      margin-top: 6px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      margin-right: 6px;
    }
    .badge-confidence {
      background: #dbeafe;
      color: #1d4ed8;
    }
    .badge-status {
      background: #e5e7eb;
      color: #374151;
    }
    .badge-autopilot {
      background: #dcfce7;
      color: #166534;
    }
    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    pre {
      background: #111827;
      color: #f9fafb;
      padding: 12px;
      border-radius: 10px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.hidden{display:none}
    .modal-box{background:#fff;border-radius:14px;padding:28px;max-width:420px;width:100%;box-shadow:0 20px 60px -10px rgba(0,0,0,.25)}
    .modal-title{font-size:15px;font-weight:700;color:#111827;margin-bottom:4px}
    .modal-sub{font-size:13px;color:#6b7280;margin-bottom:14px}
    .modal-textarea{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;font-size:13px;color:#111827;resize:vertical;min-height:80px;outline:none;transition:.15s}
    .modal-textarea:focus{border-color:#2563eb}
    .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
    .modal-err{font-size:11px;color:#dc2626;margin-top:5px;min-height:15px}
  </style>
</head>
<body>
  <h1>Bridge Hub — Approval Dashboard</h1>

  <div class="toolbar">
    <button onclick="loadQueue()">Refresh Queue</button>
    <button class="secondary" onclick="clearPreview()">Clear Preview</button>
  </div>

  <div id="queue"></div>

  <h2>Preview</h2>
  <pre id="preview">No preview loaded.</pre>

  <script>
    async function loadQueue() {
      const res = await fetch('/approval/queue');
      const data = await res.json();
      const queue = data?.data?.queue || [];
      const root = document.getElementById('queue');
      root.innerHTML = '';

      if (!queue.length) {
        root.innerHTML = '<div class="card">Queue is empty.</div>';
        return;
      }

      queue.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';

        const confidence = item.confidence ?? 'N/A';
        const status = item.status ?? 'unknown';

        div.innerHTML = `
          <div class="row">
            <div>
              <strong>${item.description || 'No description'}</strong>
              <div class="meta">Partner: ${item.partner || 'N/A'}</div>
              <div class="meta">Amount: ${item.amount ?? 'N/A'}</div>
              <div class="meta">Account: ${item.account_code || 'N/A'}</div>
            </div>
            <div>
              <span class="badge badge-confidence">Confidence: ${confidence}</span>
              <span class="badge badge-status">Status: ${status}</span>
              ${item.review_required ? '' : '<span class="badge badge-autopilot">Autopilot Candidate</span>'}
            </div>
          </div>
          <div class="actions">
            <button onclick="approveDraft(${item.id})">Approve</button>
            <button onclick="rejectDraft(${item.id})">Reject</button>
            <button class="secondary" onclick='previewDraft(${JSON.stringify({
              description: item.description,
              partner: item.partner,
              amount: item.amount,
              account_code: item.account_code,
              confidence: item.confidence,
              status: item.status
            }).replace(/'/g, "&apos;")})'>Preview</button>
          </div>
        `;

        root.appendChild(div);
      });
    }

    async function approveDraft(id) {
      const res = await fetch(`/approval/approve/${id}`, { method: 'POST' });
      const data = await res.json();
      alert(data.message || 'Approved');
      loadQueue();
    }

    let _rejectId = null;
    function _openRejectModal(id){
      _rejectId = id;
      document.getElementById('rejReason').value='';
      document.getElementById('rejErr').textContent='';
      document.getElementById('rejDraftId').textContent=id;
      document.getElementById('rejectModal').classList.remove('hidden');
      setTimeout(()=>document.getElementById('rejReason').focus(),60);
    }
    function _closeRejectModal(){ document.getElementById('rejectModal').classList.add('hidden'); _rejectId=null; }
    async function _confirmReject(){
      const reason = document.getElementById('rejReason').value.trim();
      if(!reason){ document.getElementById('rejErr').textContent='Enter a reason'; return; }
      _closeRejectModal();
      const res = await fetch(`/approval/reject/${_rejectId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason })
      });
      const data = await res.json();
      if(!data.ok) alert(data.message || 'Error');
      loadQueue();
    }
    async function rejectDraft(id) { _openRejectModal(id); }
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') _closeRejectModal(); });

    async function previewDraft(payload) {
      const res = await fetch('/approval/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      document.getElementById('preview').textContent = JSON.stringify(data, null, 2);
    }

    function clearPreview() {
      document.getElementById('preview').textContent = 'No preview loaded.';
    }

    loadQueue();
  </script>

<!-- Reject Modal -->
<div class="modal-overlay hidden" id="rejectModal" onclick="if(event.target===this)_closeRejectModal()">
  <div class="modal-box">
    <div class="modal-title">Reject Draft</div>
    <div class="modal-sub">Draft #<span id="rejDraftId"></span> — provide a reason</div>
    <textarea class="modal-textarea" id="rejReason" placeholder="Reason for rejection..."></textarea>
    <div class="modal-err" id="rejErr"></div>
    <div class="modal-actions">
      <button style="padding:8px 14px;border-radius:8px;cursor:pointer;background:#6b7280;color:#fff;border:none" onclick="_closeRejectModal()">Cancel</button>
      <button style="padding:8px 14px;border-radius:8px;cursor:pointer;background:#dc2626;color:#fff;border:none" onclick="_confirmReject()">Reject</button>
    </div>
  </div>
</div>
</body>
</html>
