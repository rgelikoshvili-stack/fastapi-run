  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "Dockerfile"
      - "Procfile"
      - "app/api/client_ip.py"
      - "app/api/trusted_request_origin.py"
      - "app/api/trusted_host_guard.py"
      - "app/api/security.py"
      - "app/api/slowapi_shared_guard.py"
      - "app/api/middleware/rate_limit_middleware.py"
      - "app/api/services/rate_limiter_service.py"
      - "app/api/services/rate_limit_policy_service.py"
      - "static/reset_password.html"
      - "app/api/routes_oauth.py"
      - "app/api/routes_auth.py"
      - "app/api/authz.py"
      - "app/api/routes_reports.py"
      - "app/api/routes_chat.py"
      - "app/api/routes_ai_chat.py"
      - "app/api/services/ai_session_scope.py"
      - "app/api/services/llm_service.py"
      - "app/api/services/ai_tool_registry.py"
      - "app/api/services/financial_statements_service.py"
      - "tests/unit/test_chat180_cashflow_completeness.py"
      - "bridge_hub_vector_db.py"
      - "app/api/services/posting_service.py"
      - "app/api/services/posted_ledger_validation.py"
      - "app/api/services/posted_ledger_reporting.py"
      - "tests/unit/test_chat181_functional_currency.py"
      - "app/api/routes_erp_memory.py"
      - "app/api/routes_erp_import.py"
      - "app/api/routes_erp_connectors.py"
      - "app/api/services/erp_memory_service.py"
      - "app/api/services/erp_import_service.py"
      - "app/api/services/erp_history_import_service.py"
      - "tests/unit/test_chat180_erp_history_tenant.py"
      - "app/api/services/ledger_service.py"
      - "app/api/services/cashflow_classification_service.py"
      - "docs/sql/chat179_posted_ledger_tenant_constraints_DRAFT.sql"
      - "app/storage/migrations/011_posted_journal_entries_schema.sql"
      - "app/api/services/chat_session_service.py"
      - "app/api/policy/permission_map.py"
      - "app/api/routes_ask_bridge_hub.py"
      - "app/api/services/ask_bridge_hub_service.py"
      - "app/api/services/chat_context_service.py"
      - "app/api/services/chat_context_formatter_service.py"
      - "app/api/routes_audit_trail.py"
      - "static/outgoing_form.html"
      - "app/api/middleware/auth_middleware.py"
      - "app/api/middleware/rbac_middleware.py"
      - "app/api/routes_notifications_ws.py"
      - "app/api/services/auth_service.py"
      - "app/storage/migrations/014_durable_oauth_login_states.sql"
      - "app/storage/migrations/015_user_auth_version.sql"
      - "app/storage/migrations/016_password_reset_tokens.sql"
      - "tests/integration/test_chat162_oauth_state_postgres.py"
      - "tests/integration/test_chat165_auth_staging_readiness_postgres.py"
      - "tests/integration/test_chat166_session_version_postgres.py"
      - "tests/integration/test_chat167_auth_forced_rls_postgres.py"
      - "tests/unit/test_chat161_oauth_state.py"
      - "tests/unit/test_chat161_refresh_membership.py"
      - "tests/unit/test_chat164_live_access_revocation.py"
      - "tests/unit/test_chat164_websocket_revocation.py"
      - "tests/unit/test_chat169_password_reset_security.py"
      - "tests/unit/test_chat170_trusted_proxy_rate_limits.py"
      - "tests/unit/test_chat171_shared_rate_limit_fail_closed.py"
      - "tests/unit/test_chat172_slowapi_shared_guard.py"
      - "tests/unit/test_chat173_https_oauth_host_proxy.py"
      - "tests/unit/test_chat174_trusted_host_guard.py"
      - "tests/unit/test_chat175_signature_stamp_security.py"
      - "tests/unit/test_chat176_finance_chat_isolation.py"
      - "tests/unit/test_chat177_ai_api_tenant_guard.py"
      - "tests/unit/test_chat178_vector_and_ledger_guards.py"
      - "tests/unit/test_chat179_posted_writer_classification.py"
      - "tests/unit/test_chat180_posted_ledger_validation.py"
      - "tests/unit/test_p0_ai_action_confirm.py"
      - "tests/unit/test_oauth_existing_tenant_membership.py"
      - ".github/workflows/chat162-oauth-state-postgres.yml"

permissions:
  contents: read

jobs:
  chat162-disposable-postgres:
    name: "OAuth migration and JWT refresh (Postgres ${{ matrix.postgres }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: bridge_hub_chat162_test
          POSTGRES_USER: chat162_test_user
          POSTGRES_PASSWORD: chat162_synthetic_password_only_not_real
        ports:
          - 55442:5432
        options: >-
          --health-cmd "pg_isready -U chat162_test_user -d bridge_hub_chat162_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_MODE: "1"
      JWT_SECRET: "chat162-synthetic-jwt-secret-32-bytes-only"
      DATABASE_URL: ""
      CHAT162_TEST_DATABASE_URL: postgresql://chat162_test_user:chat162_synthetic_password_only_not_real@127.0.0.1:55442/bridge_hub_chat162_test
    steps:
      - name: Checkout isolated PR
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run production-major-version DB migration and auth tests against disposable DB ONLY
        run: >-
          python -m pytest
          tests/integration/test_chat162_oauth_state_postgres.py
          tests/integration/test_chat165_auth_staging_readiness_postgres.py
          tests/integration/test_chat166_session_version_postgres.py
          tests/integration/test_chat167_auth_forced_rls_postgres.py
          tests/unit/test_chat161_oauth_state.py
          tests/unit/test_chat161_refresh_membership.py
          tests/unit/test_chat164_live_access_revocation.py
          tests/unit/test_chat164_websocket_revocation.py
          tests/unit/test_chat169_password_reset_security.py
          tests/unit/test_chat170_trusted_proxy_rate_limits.py
          tests/unit/test_chat171_shared_rate_limit_fail_closed.py
          tests/unit/test_chat172_slowapi_shared_guard.py
          tests/unit/test_chat173_https_oauth_host_proxy.py
          tests/unit/test_chat174_trusted_host_guard.py
          tests/unit/test_chat175_signature_stamp_security.py
          tests/unit/test_chat176_finance_chat_isolation.py
          tests/unit/test_chat177_ai_api_tenant_guard.py
          tests/unit/test_chat178_vector_and_ledger_guards.py
          tests/unit/test_chat179_posted_writer_classification.py
          tests/unit/test_chat180_posted_ledger_validation.py
          tests/unit/test_chat180_erp_history_tenant.py
          tests/unit/test_chat180_cashflow_completeness.py
          tests/unit/test_chat181_functional_currency.py
          tests/unit/test_p0_ai_action_confirm.py
          tests/unit/test_oauth_existing_tenant_membership.py
          -q -s --tb=short
