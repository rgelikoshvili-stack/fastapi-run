name: NEXT-03 Balance Credential Vault PostgreSQL

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/services/balance_credentials_service.py"
      - "app/api/connectors/balance_connector.py"
      - "app/api/routes_balance_credentials.py"
      - "app/api/routes_balance_ge.py"
      - "app/api/services/posting_service.py"
      - "tests/unit/test_balance_credentials_vault_wiring.py"
      - "tests/unit/test_routes_balance_ge_vault_credentials.py"
      - "tests/unit/test_posting_log_fields.py"
      - "tests/integration/test_next03_balance_credentials_postgres.py"
      - ".github/workflows/next03-credential-vault-postgres.yml"

permissions:
  contents: read

jobs:
  credential-vault-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bridge_hub_next03_test
          POSTGRES_USER: next03_test_user
          POSTGRES_PASSWORD: next03_synthetic_test_password_only
        ports:
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U next03_test_user -d bridge_hub_next03_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MODE: "1"
      JWT_SECRET: next03-test-only-secret-not-for-production-000000
      NEXT03_TEST_DATABASE_URL: postgresql://next03_test_user:next03_synthetic_test_password_only@127.0.0.1:55438/bridge_hub_next03_test
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run focused credential and disposable PostgreSQL tests
        run: >-
          python -m pytest
          tests/unit/test_balance_credentials_vault_wiring.py
          tests/unit/test_routes_balance_ge_vault_credentials.py
          tests/unit/test_posting_log_fields.py
          tests/unit/test_credential_vault_service.py
          tests/unit/test_credential_vault_routes.py
          tests/unit/test_masked_read_runtime.py
          tests/integration/test_next03_balance_credentials_postgres.py
          -q --tb=short
