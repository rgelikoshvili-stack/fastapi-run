<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bridge Hub · შესვლა</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f3ecdc;--paper:#faf7f2;--accent:#8c3c2d;--ink:#1a1512;
  --ink-soft:#5c4a3a;--line:#e0d8cc;--radius:10px;
}
body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;color:var(--ink);}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:40px 44px;width:100%;max-width:440px;box-shadow:0 4px 24px rgba(0,0,0,.08);}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.logo-text{font-size:20px;font-weight:700;letter-spacing:.02em;}
.logo-text em{font-style:italic;color:var(--accent);}
h1{font-size:22px;margin-bottom:6px;}
.sub{color:var(--ink-soft);font-size:14px;margin-bottom:28px;}
.field{margin-bottom:16px;}
label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase;}
input{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:var(--radius);font-size:14px;font-family:inherit;background:var(--bg);color:var(--ink);outline:none;transition:border-color .15s;}
input:focus{border-color:var(--accent);}
.btn{width:100%;padding:12px;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--accent);color:#fff;margin-top:8px;transition:opacity .15s;}
.btn:hover{opacity:.88;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.err{color:var(--accent);font-size:13px;margin-top:8px;min-height:18px;}
.foot{text-align:center;margin-top:20px;font-size:13px;color:var(--ink-soft);}
.foot a{color:var(--accent);text-decoration:underline;cursor:pointer;}
.divider{border:none;border-top:1px solid var(--line);margin:22px 0;}
.oauth-section p{text-align:center;font-size:12px;color:var(--ink-soft);margin-bottom:12px;position:relative;}
.oauth-section p::before,.oauth-section p::after{content:'';position:absolute;top:50%;width:38%;height:1px;background:var(--line);}
.oauth-section p::before{left:0} .oauth-section p::after{right:0}
.btn-oauth{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px;border:1.5px solid var(--line);border-radius:var(--radius);background:#fff;font-size:14px;font-family:inherit;cursor:pointer;margin-bottom:10px;transition:border-color .15s,box-shadow .15s;color:var(--ink);}
.btn-oauth:hover{border-color:var(--accent);box-shadow:0 1px 6px rgba(0,0,0,.1);}
.btn-oauth svg{width:20px;height:20px;flex-shrink:0;}
.tenant-field{margin-bottom:16px;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 40 40" fill="none" width="36" height="36">
      <rect width="40" height="40" rx="8" fill="#8c3c2d"/>
      <path d="M8 28 L20 12 L32 28" stroke="#f3ecdc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M14 22 L26 22" stroke="#f3ecdc" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div class="logo-text">Bridge <em>Hub</em></div>
  </div>

  <h1>შესვლა</h1>
  <p class="sub">Bridge Hub · Financial OS</p>

  <div class="field">
    <label>ელ-ფოსტა</label>
    <input id="email" type="email" placeholder="you@company.ge" autofocus/>
  </div>
  <div class="field">
    <label>პაროლი</label>
    <input id="password" type="password" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')doLogin()"/>
  </div>
  <div class="tenant-field" id="tenantWrap" style="display:none">
    <label>Tenant ID <span style="color:#a89880;font-weight:400;text-transform:none">(სურვილისამებრ)</span></label>
    <input id="tenant" type="text" placeholder="default"/>
  </div>

  <div class="err" id="err"></div>
  <button class="btn" id="btn" onclick="doLogin()">შესვლა</button>

  <div style="margin-top:10px;text-align:right">
    <a href="/static/reset_password.html" style="font-size:12px;color:var(--ink-soft)">პაროლი დაგავიწყდა?</a>
    &nbsp;·&nbsp;
    <a onclick="document.getElementById('tenantWrap').style.display=document.getElementById('tenantWrap').style.display==='none'?'block':'none'" style="font-size:12px;color:var(--ink-soft);cursor:pointer">Tenant ID</a>
  </div>

  <div class="oauth-section" id="oauth-section" style="display:none">
    <hr class="divider"/>
    <p>ან</p>
    <button class="btn-oauth" onclick="oauthLogin('google')">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google-ით შესვლა
    </button>
    <button class="btn-oauth" onclick="oauthLogin('microsoft')">
      <svg viewBox="0 0 24 24"><path fill="#f25022" d="M1 1h10v10H1z"/><path fill="#7fba00" d="M13 1h10v10H13z"/><path fill="#00a4ef" d="M1 13h10v10H1z"/><path fill="#ffb900" d="M13 13h10v10H13z"/></svg>
      Microsoft-ით შესვლა
    </button>
  </div>

  <div class="foot">
    ანგარიში არ გაქვს? <a href="/static/signup.html">რეგისტრაცია — 14 დღე უფასოდ</a>
  </div>
</div>

<script>
// Redirect if already logged in
if (localStorage.getItem('access_token')) {
  window.location.replace('/');
}

// Show OAuth buttons if configured
(async () => {
  try {
    const r = await fetch('/auth/oauth/providers');
    const d = await r.json();
    if (d.data?.configured?.length > 0) {
      document.getElementById('oauth-section').style.display = 'block';
    }
  } catch(e) {}
})();

function oauthLogin(provider) {
  const tenantId = document.getElementById('tenant').value.trim() || 'default';
  window.location.href = `/auth/oauth/${provider}/login?tenant_id=${encodeURIComponent(tenantId)}`;
}

async function doLogin() {
  const btn = document.getElementById('btn');
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const tenant_id = document.getElementById('tenant').value.trim() || 'default';

  if (!email || !password) {
    errEl.textContent = 'შეავსეთ ყველა ველი';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ შემოწმება…';

  try {
    const r = await fetch('/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password, tenant_id}),
    });
    const d = await r.json();

    if (!r.ok || !d.ok) {
      errEl.textContent = d.error?.details || d.message || 'პაროლი ან ელ-ფოსტა არასწორია';
      return;
    }

    const data = d.data || d;
    localStorage.setItem('access_token', data.access_token || '');
    localStorage.setItem('refresh_token', data.refresh_token || '');
    localStorage.setItem('tenant_id', tenant_id);

    window.location.replace('/');
  } catch(e) {
    errEl.textContent = 'კავშირის შეცდომა — სცადე ხელახლა';
  } finally {
    btn.disabled = false;
    btn.textContent = 'შესვლა';
  }
}
</script>
</body>
</html>
