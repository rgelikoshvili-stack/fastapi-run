<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bridge Hub Patterns Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f7f9fc;
      color: #1f2937;
    }
    h1 {
      margin-bottom: 16px;
    }
    .toolbar {
      margin-bottom: 16px;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      margin-right: 6px;
    }
    .active { background: #dcfce7; color: #166534; }
    .candidate { background: #fef3c7; color: #92400e; }
    .inactive { background: #e5e7eb; color: #374151; }
    .meta {
      color: #6b7280;
      font-size: 14px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h1>Bridge Hub — Patterns Dashboard</h1>

  <div class="toolbar">
    <button onclick="loadPatterns()">Refresh Patterns</button>
  </div>

  <div id="patterns"></div>

  <script>
    async function loadPatterns() {
      const res = await fetch('/patterns');
      const data = await res.json();
      const rows = data?.data?.patterns || data?.data || [];
      const root = document.getElementById('patterns');
      root.innerHTML = '';

      if (!rows.length) {
        root.innerHTML = '<div class="card">No patterns found.</div>';
        return;
      }

      rows.forEach(item => {
        const state = (item.status || item.state || 'candidate').toLowerCase();
        const badgeClass = state === 'active' ? 'active' : state === 'inactive' ? 'inactive' : 'candidate';

        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <strong>${item.description || item.pattern_key || 'Pattern'}</strong>
          <div class="meta">Account Code: ${item.account_code || 'N/A'}</div>
          <div class="meta">Support Count: ${item.support_count ?? 'N/A'}</div>
          <div class="meta">Confidence: ${item.confidence ?? 'N/A'}</div>
          <div class="meta">Success Count: ${item.success_count ?? 'N/A'}</div>
          <div class="meta">Failure Count: ${item.failure_count ?? 'N/A'}</div>
          <div class="meta">
            <span class="badge ${badgeClass}">${state}</span>
          </div>
        `;
        root.appendChild(div);
      });
    }

    loadPatterns();
  </script>
</body>
</html>
