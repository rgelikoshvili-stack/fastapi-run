name: NEXT-04A RLS Fail-Closed Disposable PostgreSQL

on:
  push:
    branches: [codex/next04a1-runtime-compatibility, codex/next04a2-startup-dml-safety, codex/next04a11-migration-readiness]
  pull_request:
    branches: [main, codex/next04a-rls-fail-closed-foundation, codex/next04a1-runtime-compatibility]
    paths:
      - "app/api/db.py"
      - "app/api/middleware/auth_middleware.py"
      - "app/api/middleware/rbac_middleware.py"
      - "app/api/routes_worker.py"
      - "app/api/services/approval_service.py"
      - "app/api/services/document_processing_service.py"
      - "app/api/services/email_collector.py"
      - "app/api/services/admin_dashboard_service.py"
      - "app/api/services/saas_service.py"
      - "app/api/services/system_service.py"
      - "app/api/services/export_service.py"
      - "app/api/services/worker_client.py"
      - "app/context_memory/context_builder.py"
      - "app/startup/background.py"
      - "app/startup/migrations_indexes.py"
      - "app/api/backfill_tx_fingerprint.py"
      - "app/storage/migrations/013_rls_fail_closed_foundation.sql"
      - "tests/integration/test_next04a_rls_fail_closed_postgres.py"
      - "tests/integration/test_next04a11_migration_runner_postgres.py"
      - "tests/unit/test_migration013_controlled_runner.py"
      - "scripts/run_migration_013_controlled.py"
      - "tests/unit/test_next04a_tenant_db_context.py"
      - "tests/unit/test_next04a1_worker_callback_auth.py"
      - "tests/unit/test_next04a1_service_tenant_context.py"
      - "tests/unit/test_background_autopilot_multitenant.py"
      - "tests/unit/test_startup_no_tenant_business_dml.py"
      - ".github/workflows/next04a-rls-fail-closed-postgres.yml"

permissions:
  contents: read

jobs:
  rls-fail-closed-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bridge_hub_next04a_test
          POSTGRES_USER: next04a_test_admin
          POSTGRES_PASSWORD: next04a_synthetic_test_password_only
        ports:
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U next04a_test_admin -d bridge_hub_next04a_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT04A_TEST_DATABASE_URL: postgresql://next04a_test_admin:next04a_synthetic_test_password_only@127.0.0.1:55438/bridge_hub_next04a_test
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run NEXT-04A disposable PostgreSQL RLS proofs
        run: >-
          python -m pytest
          tests/integration/test_next04a_rls_fail_closed_postgres.py
          tests/integration/test_next04a11_migration_runner_postgres.py
          -q --tb=short
