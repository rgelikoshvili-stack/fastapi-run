<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bridge Hub — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3ecdc;--paper-soft:#ebe2ce;--paper-sunk:#e3d8bf;
  --card:#faf3e3;--card-hover:#ebe0c5;
  --line:#dfd3b8;--line-soft:#ebe0c5;--line-strong:#d8c9a8;
  --ink:#1a1512;--ink-soft:#3a2f28;--ink-mute:#5a4a3a;--ink-dim:#7a6a5a;--ink-ghost:#a89880;
  --accent:#8c3c2d;--accent-d:#6a2e22;--accent-soft:rgba(140,60,45,.08);
  --green:#27500A;--green-bg:#EAF3DE;--green-border:rgba(39,80,10,.2);
  --amber:#7a4f00;--amber-bg:#FAEEDA;--amber-border:#EF9F27;
  --red:#791F1F;--red-bg:#FCEBEB;--red-border:rgba(121,31,31,.2);
  --blue:#3a5a8c;--blue-soft:rgba(58,90,140,.1);
  --teal:#1a5a5a;--teal-soft:rgba(26,90,90,.1);
  --purple:#6a3a7c;--purple-soft:rgba(106,58,124,.1);
  --font:'Inter',ui-sans-serif,system-ui,sans-serif;
  --serif:'Instrument Serif',serif;
  --mono:'Geist Mono',ui-monospace,monospace;
  --sidebar:280px;--header:72px;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
body{display:flex;min-height:100vh;background:
  radial-gradient(900px 600px at 10% 0%,rgba(180,145,95,.12),transparent 55%),
  radial-gradient(700px 500px at 100% 100%,rgba(140,60,45,.06),transparent 55%),
  var(--paper);}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;box-shadow:inset -1px 0 0 rgba(255,250,235,.4);}
.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line-soft);}
.logo{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-size:22px;flex-shrink:0;}
.bname{font-size:17px;font-weight:500;letter-spacing:-0.015em;line-height:1}
.bname em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--ink-soft);margin-left:2px}
.brole{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-dim);margin-top:3px}
.nav{flex:1;overflow-y:auto;padding:4px 12px 10px}
.sec{padding:14px 4px 6px;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-dim);}
.sec::after{content:'';flex:1;height:1px;background:var(--line-strong)}
.item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:.1s;color:var(--ink-soft);margin:1px 0;user-select:none;}
.item:hover{background:var(--card-hover)}
.item .ic{width:16px;height:16px;stroke:var(--ink-mute);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.item .lbl{font-size:13.5px;color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:450;}
.item .badge{font-family:var(--mono);font-size:10px;background:var(--paper-sunk);color:var(--ink-ghost);padding:1px 6px;border-radius:10px;}
.item.active{background:var(--ink);box-shadow:0 4px 12px -3px rgba(26,21,18,.4);}
.item.active .lbl{color:var(--paper);font-weight:500}
.item.active .ic{stroke:var(--paper)}
.item.active .badge{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
.foot{padding:12px 16px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:11px;}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,var(--accent),var(--accent-d));color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-size:16px;flex-shrink:0;}
.uname{font-size:13px;font-weight:500}
.urole{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--ink-dim);margin-top:1px}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--header);padding:16px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--paper);position:sticky;top:0;z-index:30;}
.crumbs{flex:1;font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);letter-spacing:.1em;text-transform:uppercase;}
.crumbs em{font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);margin-left:2px}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;}
.icon-btn:hover{background:var(--card-hover)}
.icon-btn svg{width:15px;height:15px;stroke:var(--ink-mute);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}

/* ── CONTENT ── */
.content{flex:1;padding:28px;overflow-y:auto}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;}
.page-title{font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.2}
.page-title em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--ink-dim);margin-left:6px;font-size:18px}
.page-sub{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-dim);margin-top:4px}

/* ── STAT CARDS ── */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
@media(max-width:900px){.stats-strip{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;inset:0;opacity:.04;pointer-events:none}
.stat-card.s-amber::before{background:var(--amber)}
.stat-card.s-green::before{background:var(--green)}
.stat-card.s-blue::before{background:var(--blue)}
.stat-card.s-accent::before{background:var(--accent)}
.stat-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.s-amber .stat-icon{background:var(--amber-bg)}
.s-green .stat-icon{background:var(--green-bg)}
.s-blue .stat-icon{background:var(--blue-soft)}
.s-accent .stat-icon{background:var(--accent-soft)}
.stat-icon svg{width:16px;height:16px;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.s-amber .stat-icon svg{stroke:var(--amber)}
.s-green .stat-icon svg{stroke:var(--green)}
.s-blue .stat-icon svg{stroke:var(--blue)}
.s-accent .stat-icon svg{stroke:var(--accent)}
.stat-num{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.03em;line-height:1}
.stat-lbl{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-dim);margin-top:5px}
.stat-delta{font-family:var(--mono);font-size:10px;color:var(--ink-ghost);margin-top:3px}

/* ── GRID ── */
.dash-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;}
@media(max-width:1100px){.dash-grid{grid-template-columns:1fr}}

/* ── PANEL ── */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;}
.panel-title{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.panel-sub{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--ink-dim);margin-top:2px}
.panel-link{font-family:var(--mono);font-size:10.5px;color:var(--ink-ghost);letter-spacing:.05em;cursor:pointer;text-transform:uppercase;transition:.1s;}
.panel-link:hover{color:var(--accent)}

/* ── APPROVAL LIST ── */
.appr-item{padding:12px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;gap:12px;transition:.1s;cursor:pointer;}
.appr-item:last-child{border-bottom:none}
.appr-item:hover{background:var(--card-hover)}
.appr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.appr-dot.drafted{background:var(--ink-ghost)}
.appr-dot.approved{background:var(--green)}
.appr-dot.awaiting_cfo{background:var(--amber)}
.appr-dot.rejected{background:var(--red)}
.appr-dot.posted{background:var(--blue)}
.appr-info{flex:1;min-width:0}
.appr-desc{font-size:13px;color:var(--ink);font-weight:450;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appr-meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-ghost);margin-top:3px}
.appr-amount{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;flex-shrink:0}
.appr-empty{padding:40px 20px;text-align:center;font-family:var(--serif);font-style:italic;color:var(--ink-dim);font-size:14px}

/* ── STATUS PANEL ── */
.status-row{padding:11px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;}
.status-row:last-child{border-bottom:none}
.status-indicator{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-indicator.ok{background:var(--green)}
.status-indicator.warn{background:var(--amber)}
.status-indicator.err{background:var(--red)}
.status-indicator.dim{background:var(--ink-ghost)}
.status-key{font-size:12.5px;color:var(--ink-soft);flex:1}
.status-val{font-family:var(--mono);font-size:11px;color:var(--ink-ghost)}
</style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside class="sidebar" id="sidebar-mount"></aside>

<!-- ── MAIN ── -->
<div class="main">
  <div class="topbar">
    <div class="crumbs">Bridge Hub / <em>მთავარი</em></div>
    <button class="icon-btn" title="განახლება" onclick="refreshAll()">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.6-6.6L23 10"/></svg>
    </button>
  </div>

  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Dashboard <em>მთავარი</em></div>
        <div class="page-sub" id="page-sub">Loading…</div>
      </div>
    </div>

    <!-- Stat cards -->
    <div class="stats-strip">
      <div class="stat-card s-amber">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div class="stat-num" id="s-pending">0</div>
        <div class="stat-lbl">მოლოდინშია</div>
        <div class="stat-delta" id="s-pending-sub">pending approval</div>
      </div>
      <div class="stat-card s-green">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="stat-num" id="s-approved">0</div>
        <div class="stat-lbl">დამტკიცებული</div>
        <div class="stat-delta">approved today</div>
      </div>
      <div class="stat-card s-blue">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </div>
        <div class="stat-num" id="s-auto">0</div>
        <div class="stat-lbl">ავტო-პილოტი</div>
        <div class="stat-delta">auto-approved</div>
      </div>
      <div class="stat-card s-accent">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        </div>
        <div class="stat-num" id="s-rejected">0</div>
        <div class="stat-lbl">უარყოფილი</div>
        <div class="stat-delta">rejected</div>
      </div>
    </div>

    <!-- 2-column layout -->
    <div class="dash-grid">

      <!-- Recent approvals -->
      <div class="panel">
        <div class="panel-head">
          <div>
            <div class="panel-title">ბოლო განხილვები</div>
            <div class="panel-sub">recent approvals</div>
          </div>
          <a href="/static/approval_dashboard.html" class="panel-link">ყველა →</a>
        </div>
        <div id="approvals-list"><div class="appr-empty">Loading…</div></div>
      </div>

      <!-- System status -->
      <div class="panel">
        <div class="panel-head">
          <div>
            <div class="panel-title">სისტემის სტატუსი</div>
            <div class="panel-sub">system status</div>
          </div>
        </div>
        <div id="status-list">
          <div class="status-row">
            <span class="status-indicator dim"></span>
            <span class="status-key">API</span>
            <span class="status-val" id="st-api">—</span>
          </div>
          <div class="status-row">
            <span class="status-indicator dim" id="si-db"></span>
            <span class="status-key">Database</span>
            <span class="status-val" id="st-db">—</span>
          </div>
          <div class="status-row">
            <span class="status-indicator dim" id="si-mode"></span>
            <span class="status-key">Mode</span>
            <span class="status-val" id="st-mode">—</span>
          </div>
          <div class="status-row">
            <span class="status-indicator dim" id="si-version"></span>
            <span class="status-key">Version</span>
            <span class="status-val" id="st-version">—</span>
          </div>
          <div class="status-row">
            <span class="status-indicator dim" id="si-tenant"></span>
            <span class="status-key">Tenant</span>
            <span class="status-val" id="st-tenant">—</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
function _esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function _token() {
  return localStorage.getItem('access_token') || localStorage.getItem('bh_token') || '';
}

function _headers() {
  const t = _token();
  return t ? { Authorization: 'Bearer ' + t } : {};
}

async function loadStats() {
  try {
    const res = await fetch('/approval/stats', { headers: _headers() });
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    const d = (j.ok ? j.data : j) || {};
    document.getElementById('s-pending').textContent   = d.pending_count   ?? d.drafted   ?? 0;
    document.getElementById('s-approved').textContent  = d.approved_today  ?? d.approved  ?? 0;
    document.getElementById('s-auto').textContent      = d.auto_approved   ?? 0;
    document.getElementById('s-rejected').textContent  = d.rejected        ?? 0;
    document.getElementById('s-pending-sub').textContent = 'pending approval';
  } catch (_) {
    ['s-pending','s-approved','s-auto','s-rejected'].forEach(id => {
      document.getElementById(id).textContent = '0';
    });
  }
}

async function loadApprovals() {
  const el = document.getElementById('approvals-list');
  try {
    const res = await fetch('/approval/list?limit=6', { headers: _headers() });
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    const items = (j.ok ? j.data?.items : j.items) || [];
    if (!items.length) {
      el.innerHTML = '<div class="appr-empty">ჩანაწერები არ არის</div>';
      return;
    }
    el.innerHTML = items.map(function(d) {
      const status = _esc(d.status || 'drafted');
      const desc   = _esc(d.description || d.memo || d.id || '—');
      const amount = d.total_amount != null
        ? Number(d.total_amount).toLocaleString('ka-GE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ₾'
        : '';
      const ts = d.created_at ? new Date(d.created_at).toLocaleDateString('ka-GE') : '';
      return '<div class="appr-item" onclick="location.href=\'/static/approval_dashboard.html\'">' +
        '<span class="appr-dot ' + status + '"></span>' +
        '<div class="appr-info">' +
          '<div class="appr-desc">' + desc + '</div>' +
          '<div class="appr-meta">' + status + (ts ? ' · ' + ts : '') + '</div>' +
        '</div>' +
        (amount ? '<div class="appr-amount">' + _esc(amount) + '</div>' : '') +
      '</div>';
    }).join('');
  } catch (_) {
    el.innerHTML = '<div class="appr-empty">ვერ ჩაიტვირთა</div>';
  }
}

async function loadHealth() {
  try {
    const res = await fetch('/health');
    const j   = await res.json();
    const d   = (j.ok ? j.data : j) || {};

    document.getElementById('st-api').textContent     = 'OK';
    document.getElementById('si-db').className        = 'status-indicator ' + (d.db === 'ok' ? 'ok' : 'warn');
    document.getElementById('st-db').textContent      = d.db || 'ok';
    document.getElementById('si-mode').className      = 'status-indicator ok';
    document.getElementById('st-mode').textContent    = d.mode || 'active';
    document.getElementById('si-version').className   = 'status-indicator ok';
    document.getElementById('st-version').textContent = d.version || d.git_sha?.slice(0,7) || '—';
    document.getElementById('si-tenant').className    = 'status-indicator ok';
    document.getElementById('st-tenant').textContent  = d.tenant_id || 'default';

    const now = new Date().toLocaleTimeString('ka-GE', {hour:'2-digit',minute:'2-digit'});
    document.getElementById('page-sub').textContent = 'განახლდა ' + now;
  } catch (_) {
    document.getElementById('st-api').textContent = 'unavailable';
    document.getElementById('page-sub').textContent = 'სისტემა მიუწვდომელია';
  }
}

function refreshAll() {
  loadStats();
  loadApprovals();
  loadHealth();
}

// Load user info from localStorage
(function initUser() {
  const name = localStorage.getItem('bh_user_name') || localStorage.getItem('user_name') || '';
  const role = localStorage.getItem('bh_user_role') || localStorage.getItem('user_role') || '';
  if (name) document.title = 'Bridge Hub — ' + name;
})();

refreshAll();
</script>

<script src="/static/js/sidebar.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  if (typeof BridgeHub !== 'undefined' && BridgeHub.loadSidebar) {
    BridgeHub.loadSidebar('dashboard');
  }
});
</script>
</body>
</html>
