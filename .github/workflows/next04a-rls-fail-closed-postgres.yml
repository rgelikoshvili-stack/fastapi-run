name: NEXT-04A RLS Fail-Closed Disposable PostgreSQL

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/db.py"
      - "app/api/middleware/auth_middleware.py"
      - "app/storage/migrations/013_rls_fail_closed_foundation.sql"
      - "tests/integration/test_next04a_rls_fail_closed_postgres.py"
      - ".github/workflows/next04a-rls-fail-closed-postgres.yml"

permissions:
  contents: read

jobs:
  rls-fail-closed-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bridge_hub_next04a_test
          POSTGRES_USER: next04a_test_admin
          POSTGRES_PASSWORD: next04a_synthetic_test_password_only
        ports:
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U next04a_test_admin -d bridge_hub_next04a_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT04A_TEST_DATABASE_URL: postgresql://next04a_test_admin:next04a_synthetic_test_password_only@127.0.0.1:55438/bridge_hub_next04a_test
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run NEXT-04A disposable PostgreSQL RLS proofs
        run: python -m pytest tests/integration/test_next04a_rls_fail_closed_postgres.py -q --tb=short
