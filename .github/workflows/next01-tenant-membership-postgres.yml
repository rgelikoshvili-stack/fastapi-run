name: NEXT-01 Tenant Membership Disposable PostgreSQL

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/routes_auth.py"
      - "app/api/routes_rbac.py"
      - "tests/unit/test_auth_register_tenant_guard_next01.py"
      - "tests/integration/test_next01_tenant_membership_postgres.py"
      - ".github/workflows/next01-tenant-membership-postgres.yml"

permissions:
  contents: read

jobs:
  tenant-membership-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bridge_hub_next01_test
          POSTGRES_USER: next01_test_user
          POSTGRES_PASSWORD: next01_synthetic_test_password_only
        ports:
          - 55436:5432
        options: >-
          --health-cmd "pg_isready -U next01_test_user -d bridge_hub_next01_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MODE: "1"
      JWT_SECRET: next01-test-only-secret-not-for-production-000000
      NEXT01_TEST_DATABASE_URL: postgresql://next01_test_user:next01_synthetic_test_password_only@127.0.0.1:55436/bridge_hub_next01_test
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run focused auth, RBAC, and PostgreSQL membership tests
        run: >-
          python -m pytest
          tests/unit/test_auth_register_tenant_guard_next01.py
          tests/unit/test_auth.py
          tests/unit/test_auth_tenant_contract.py
          tests/integration/test_rbac.py
          tests/integration/test_next01_tenant_membership_postgres.py
          -q --tb=short
