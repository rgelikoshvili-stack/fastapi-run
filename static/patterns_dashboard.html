<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bridge Hub — AI Patterns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/bh.css">
<style>
.pattern-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px 20px;margin-bottom:12px;
  box-shadow:0 4px 16px -8px rgba(60,40,20,.1);
}
.pattern-desc{font-weight:500;font-size:14px;color:var(--ink);margin-bottom:8px}
.pattern-meta{font-size:12px;color:var(--ink-dim);font-family:var(--mono);line-height:1.9}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar-mount"></aside>
<div class="main">
  <div class="topbar">
    <div class="crumbs">Bridge Hub <span class="sep">/</span> <em>AI Patterns</em></div>
    <div style="margin-left:auto">
      <button class="btn btn-ghost btn-sm" onclick="loadPatterns()">Refresh</button>
    </div>
  </div>
  <div class="content">
    <div class="page-head">
      <div>
        <div class="p-eye">AI ENGINE</div>
        <div class="p-title">AI <em>Patterns</em></div>
        <div class="p-sub">Learned classification patterns driving autopilot decisions.</div>
      </div>
      <div class="p-actions">
        <button class="btn btn-primary" onclick="loadPatterns()">Refresh Patterns</button>
      </div>
    </div>

    <div id="patterns">
      <div class="empty"><span class="empty-txt">იტვირთება…</span></div>
    </div>
  </div>
</div>

<script src="/static/js/sidebar.js"></script>
<script>
BridgeHub.loadSidebar('patterns');
</script>
<script>
    async function loadPatterns() {
      const res = await fetch('/patterns');
      const data = await res.json();
      const rows = data?.data?.patterns || data?.data || [];
      const root = document.getElementById('patterns');
      root.innerHTML = '';

      if (!rows.length) {
        root.innerHTML = '<div class="empty"><span class="empty-txt">No patterns found.</span></div>';
        return;
      }

      rows.forEach(item => {
        const state = (item.status || item.state || 'candidate').toLowerCase();
        let chipClass = 'chip-draft';
        if(state === 'active') chipClass = 'chip-approved';
        else if(state === 'inactive') chipClass = 'chip-inactive';
        else chipClass = 'chip-pending';

        const div = document.createElement('div');
        div.className = 'pattern-card';
        div.innerHTML = `
          <div class="pattern-desc">${item.description || item.pattern_key || 'Pattern'}</div>
          <div class="pattern-meta">
            Account Code: ${item.account_code || 'N/A'} &nbsp;·&nbsp;
            Support: ${item.support_count ?? 'N/A'} &nbsp;·&nbsp;
            Confidence: ${item.confidence ?? 'N/A'} &nbsp;·&nbsp;
            Success: ${item.success_count ?? 'N/A'} &nbsp;·&nbsp;
            Failure: ${item.failure_count ?? 'N/A'}
          </div>
          <div style="margin-top:8px"><span class="chip ${chipClass}">${state}</span></div>
        `;
        root.appendChild(div);
      });
    }

    loadPatterns();
</script>
</body>
</html>
