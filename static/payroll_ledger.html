<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bridge Hub — Payroll Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3ecdc;--paper-soft:#ebe2ce;--paper-sunk:#e3d8bf;
  --card:#faf3e3;--card-hover:#ebe0c5;
  --line:#dfd3b8;--line-soft:#ebe0c5;--line-strong:#d8c9a8;
  --ink:#1a1512;--ink-soft:#3a2f28;--ink-mute:#5a4a3a;--ink-dim:#7a6a5a;
  --accent:#8c3c2d;--accent-d:#6a2e22;--accent-soft:rgba(140,60,45,.08);
  --green:#27500A;--green-bg:#EAF3DE;--red:#791F1F;--red-bg:#FCEBEB;
  --font:'Inter',ui-sans-serif,system-ui,sans-serif;
  --serif:'Instrument Serif',serif;
  --mono:'Geist Mono',ui-monospace,monospace;
  --sidebar:280px;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
body{display:flex;min-height:100vh;background:radial-gradient(900px 600px at 10% 0%,rgba(180,145,95,.12),transparent 55%),radial-gradient(700px 500px at 100% 100%,rgba(140,60,45,.06),transparent 55%),var(--paper);}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.sidebar{width:var(--sidebar);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;}
.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line-soft);}
.logo{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-size:22px;flex-shrink:0;}
.bname{font-size:17px;font-weight:500;letter-spacing:-0.015em;line-height:1}
.bname em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--ink-soft);margin-left:2px}
.brole{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-dim);margin-top:3px}
.nav{flex:1;overflow-y:auto;padding:4px 12px 10px}
.sec{padding:14px 4px 6px;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-dim);}
.sec::after{content:'';flex:1;height:1px;background:var(--line-strong)}
.item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:.1s;margin:1px 0;}
.item:hover{background:var(--card-hover)}
.item .ic{width:16px;height:16px;stroke:var(--ink-mute);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.item .lbl{font-size:13.5px;color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:450;}
.item.active{background:var(--ink);box-shadow:0 4px 12px -3px rgba(26,21,18,.4);}
.item.active .lbl{color:var(--paper);font-weight:500}.item.active .ic{stroke:var(--paper)}
.foot{padding:12px 16px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:11px;}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,var(--accent),var(--accent-d));color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-size:16px;flex-shrink:0;}
.uname{font-size:13px;font-weight:500}.urole{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--ink-dim);margin-top:1px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:72px;padding:16px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--paper);position:sticky;top:0;z-index:30;}
.crumbs{flex:1;font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);letter-spacing:.1em;text-transform:uppercase;}
.crumbs em{font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)}
.content{flex:1;padding:28px;overflow-y:auto}
.filters{display:flex;gap:10px;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;font-weight:500;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-family:var(--font);font-size:13.5px;color:var(--ink);outline:none;transition:.15s}
.fld input:focus,.fld select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fld input[type=text]{width:180px}
.fld select{width:100px}
.btn-run{height:36px;padding:0 20px;background:var(--ink);color:var(--paper);border-radius:8px;font-size:13px;font-weight:500;transition:.15s;}
.btn-run:hover{background:var(--accent)}
.btn-run:disabled{opacity:.5;cursor:not-allowed}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px;}
.scard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;}
.scard .slbl{font-size:11px;font-weight:500;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.scard .sval{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--ink)}
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
.tbl-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
.ttitle{font-size:14px;font-weight:600;flex:1}
.tcount{font-family:var(--mono);font-size:12px;color:var(--ink-dim);background:var(--paper-soft);padding:2px 8px;border-radius:20px}
table{width:100%;border-collapse:collapse}
thead th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line);background:var(--paper-soft);}
thead th.num{text-align:right}
tbody tr{border-bottom:1px solid var(--line-soft)}
tbody tr:hover{background:var(--paper-soft)}
tbody tr:last-child{border-bottom:none}
tbody td{padding:11px 14px;font-size:13px;vertical-align:middle}
tbody td.num{text-align:right;font-family:var(--mono);font-size:12.5px}
.acct-dr{display:inline-flex;padding:2px 7px;border-radius:5px;font-family:var(--mono);font-size:11px;font-weight:600;background:var(--green-bg);color:var(--green)}
.acct-cr{display:inline-flex;padding:2px 7px;border-radius:5px;font-family:var(--mono);font-size:11px;font-weight:600;background:var(--red-bg);color:var(--red)}
.empty{text-align:center;padding:52px;color:var(--ink-dim);font-family:var(--serif);font-style:italic;font-size:15px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar-mount"></aside>

<div class="main">
  <div class="topbar">
    <div class="crumbs">ანალიტიკა / <em>Payroll Ledger</em></div>
  </div>
  <div class="content">

    <div class="filters">
      <div class="fld">
        <label>თანამშრომლის INN (სურვ.)</label>
        <input id="fEmp" type="text" placeholder="პირადი №">
      </div>
      <div class="fld">
        <label>წელი</label>
        <select id="fYear"></select>
      </div>
      <button class="btn-run" id="btnRun" onclick="runReport()">
        <span id="btnTxt">ჩვენება</span>
      </button>
    </div>

    <div id="errorBox" style="display:none;margin-bottom:18px;padding:12px 14px;border:1px solid #efb4b4;border-left:3px solid var(--red);border-radius:var(--r);background:#fef2f2;color:var(--red);font-size:13px;line-height:1.5"></div>

    <div class="summary" id="summary" style="display:none">
      <div class="scard">
        <div class="slbl">სულ ჩანაწერი</div>
        <div class="sval" id="sumCount">0</div>
      </div>
      <div class="scard">
        <div class="slbl">სულ ხელფასები (Dr 71xx)</div>
        <div class="sval" style="color:var(--green)" id="sumWages">0.00</div>
      </div>
      <div class="scard">
        <div class="slbl">ფილტრი</div>
        <div class="sval" id="sumFilter" style="font-size:13px;color:var(--ink-dim)">—</div>
      </div>
    </div>

    <div class="tbl-wrap" id="tblWrap" style="display:none">
      <div class="tbl-head">
        <span class="ttitle">სახელფასო პროვოდკები</span>
        <span class="tcount" id="tblCount">0</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>თარიღი</th>
            <th>თანამშრომელი</th>
            <th>INN</th>
            <th>Dt</th>
            <th>Ct</th>
            <th class="num">თანხა</th>
            <th>შენიშვნა</th>
          </tr>
        </thead>
        <tbody id="tblBody"></tbody>
      </table>
    </div>

    <div id="emptyMsg" class="empty" style="display:none">მონაცემები ვერ მოიძებნა</div>
  </div>
</div>

<script src="/static/js/core/api.js"></script>
<script src="/static/js/core/modal.js"></script>
<script src="/static/js/core/toast.js"></script>
<script src="/static/js/core/debounce.js"></script>
<script>
const token = () => localStorage.getItem('access_token') || localStorage.getItem('bh_token') || '';
const fmt = v => Number(v).toLocaleString('ka-GE',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function showPayrollToast(message, type = 'error') {
  if (window.BHToast && typeof window.BHToast.show === 'function') {
    window.BHToast.show(message, type);
  }
}
function setPayrollError(message) {
  const box = document.getElementById('errorBox');
  if (!box) return;
  if (!message) {
    box.style.display = 'none';
    box.textContent = '';
    return;
  }
  box.textContent = message;
  box.style.display = 'block';
}

async function apiRequest(path, options = {}) {
  const headers = Object.assign({}, options.headers || {}, token() ? { Authorization: 'Bearer ' + token() } : {});
  if (window.BHApi && typeof window.BHApi.request === 'function') {
    return window.BHApi.request(path, Object.assign({}, options, { headers }));
  }
  const init = Object.assign({}, options, { headers });
  const res = await fetch(path, init);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data?.error?.details || data?.message || res.statusText || 'Request failed');
    err.status = res.status;
    err.body = data;
    throw err;
  }
  return data;
}

try {
  const pl = JSON.parse(atob(token().split('.')[1]));
  document.getElementById('footName').textContent = pl.sub || pl.email || '—';
  document.getElementById('footRole').textContent = pl.role || '—';
  document.getElementById('avLetter').textContent = (pl.sub||pl.email||'U')[0].toUpperCase();
} catch(_){}

// populate year dropdown
const yr = document.getElementById('fYear');
const now = new Date().getFullYear();
for(let y = now; y >= now-5; y--){
  const opt = document.createElement('option');
  opt.value = y; opt.textContent = y;
  yr.appendChild(opt);
}

async function runReport(){
  const emp  = document.getElementById('fEmp').value.trim();
  const year = document.getElementById('fYear').value;
  const btn  = document.getElementById('btnRun');
  setPayrollError('');
  if (emp && !/^\d+$/.test(emp)) {
    const msg = 'თანამშრომლის INN უნდა შეიცავდეს მხოლოდ ციფრებს';
    setPayrollError(msg);
    showPayrollToast(msg, 'error');
    return;
  }
  document.getElementById('btnTxt').innerHTML = '<span class="spin"></span>ჩატვირთვა…';
  btn.disabled = true;

  const p = new URLSearchParams();
  if(emp)  p.set('employee_id', emp);
  if(year) p.set('year', year);
  const url = '/payroll/ledger' + ([...p].length ? '?' + p.toString() : '');

  try {
    const d = await apiRequest(url);
    if(!d.ok) throw new Error(d?.error?.details || d?.message || 'შეცდომა');
    renderReport(d.data || {}, emp, year);
  } catch(e){
    const msg = 'შეცდომა: ' + e.message;
    setPayrollError(msg);
    showPayrollToast(msg, 'error');
  } finally {
    document.getElementById('btnTxt').textContent = 'ჩვენება';
    btn.disabled = false;
  }
}

function renderReport(d, emp, year){
  setPayrollError('');
  const lines = Array.isArray(d.lines) ? d.lines : [];
  document.getElementById('sumCount').textContent  = d.count || 0;
  document.getElementById('sumWages').textContent  = fmt(d.total_wages || 0);
  document.getElementById('sumFilter').textContent = `${emp||'ყველა'} / ${year||'ყველა'}`;
  document.getElementById('summary').style.display = '';

  if(lines.length === 0){
    document.getElementById('tblWrap').style.display = 'none';
    document.getElementById('emptyMsg').style.display = '';
    return;
  }

  document.getElementById('tblCount').textContent = `${d.count || lines.length} ჩანაწერი`;
  document.getElementById('tblWrap').style.display = '';
  document.getElementById('emptyMsg').style.display = 'none';

  const tbody = document.getElementById('tblBody');
  tbody.innerHTML = '';

  for(const ln of lines){
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${esc(ln.date||'—')}</td>
      <td>${esc(ln.employee_name||'—')}</td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--ink-dim)">${esc(ln.employee_inn||'')}</td>
      <td><span class="acct-dr">${esc(ln.dr)}</span></td>
      <td><span class="acct-cr">${esc(ln.cr)}</span></td>
      <td class="num">${fmt(ln.amount)}</td>
      <td style="font-size:12px;color:var(--ink-dim)">${esc(ln.note||'')}</td>
    `;
    tbody.appendChild(tr);
  }
}

runReport();
</script>

<script src="/static/js/sidebar.js"></script>
<script>
BridgeHub.loadSidebar('payroll');
</script>
</body>
</html>
