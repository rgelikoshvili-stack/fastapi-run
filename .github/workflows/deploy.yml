name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: fastapi-run
  REGION: europe-west1
  SERVICE_URL: https://fastapi-run-226875230147.europe-west1.run.app

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          JWT_SECRET: test-secret-ci
          TEST_MODE: "1"
          DATABASE_URL: ""
        run: python -m pytest tests/unit/ -v --tb=short --ignore=tests/unit/test_document_upload.py -q

  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Skip if React app is not present
        id: react_app
        shell: bash
        run: |
          if [ -f bridge-hub-ui/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "bridge-hub-ui is not present in this backend-only tree; skipping frontend build."
          fi

      - name: Set up Node
        if: steps.react_app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bridge-hub-ui/package-lock.json

      - name: Install frontend dependencies
        if: steps.react_app.outputs.present == 'true'
        working-directory: bridge-hub-ui
        run: npm ci

      - name: Build frontend
        if: steps.react_app.outputs.present == 'true'
        working-directory: bridge-hub-ui
        run: npm run build

  deploy:
    needs: [test, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "❌ GCP_SA_KEY secret is not set. Add it in GitHub → Settings → Secrets → Actions."
            exit 1
          fi
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "❌ GCP_PROJECT_ID secret is not set."
            exit 1
          fi
          echo "✅ Secrets present"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 4 \
            --memory 2Gi \
            --cpu 2 \
            --concurrency 100 \
            --timeout 300 \
            --quiet

      - name: Smoke test — health check
        run: |
          echo "Checking: ${{ env.SERVICE_URL }}/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 5 --retry-delay 5 --retry-connrefused \
            "${{ env.SERVICE_URL }}/health")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check FAILED (HTTP $STATUS)" && exit 1
          fi
          echo "✅ Health check PASSED"
