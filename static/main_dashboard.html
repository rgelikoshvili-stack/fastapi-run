<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bridge Hub — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/bh.css">
<style>
.stat-stale{opacity:.6;font-size:.85em;font-family:var(--serif);font-style:italic;color:var(--ink-dim)}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar-mount"></aside>
<div class="main">
  <div class="topbar">
    <div class="crumbs">Bridge Hub <span class="sep">/</span> <em>Dashboard</em></div>
  </div>
  <div class="content">
    <div class="page-head">
      <div>
        <div class="p-eye">OVERVIEW</div>
        <div class="p-title">Bridge Hub <em>Dashboard</em></div>
        <div class="p-sub">System status and key metrics at a glance.</div>
      </div>
    </div>

    <div class="grid-4" id="stats">
      <div class="kpi kpi-accent"><div class="kpi-label">Loading</div><div class="kpi-val">—</div></div>
    </div>
  </div>
</div>

<script src="/static/js/sidebar.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    BridgeHub.loadSidebar('dashboard');
});
</script>
<script>
const CACHE_KEY = 'bh_main_dashboard';
const CACHE_TTL_MS = 60 * 1000; // 60 seconds

function renderStats(data, stale) {
  const root = document.getElementById('stats');
  const tag = stale ? ' <span class="stat-stale">(cached)</span>' : '';
  root.innerHTML = `
    <div class="kpi kpi-accent">
      <div class="kpi-label">Pending Drafts</div>
      <div class="kpi-val">${data.pending_count ?? '—'}${tag}</div>
    </div>
    <div class="kpi kpi-green">
      <div class="kpi-label">Auto-approved</div>
      <div class="kpi-val">${data.auto_approved ?? '—'}</div>
    </div>
    <div class="kpi kpi-blue">
      <div class="kpi-label">System</div>
      <div class="kpi-val" style="font-size:18px">ACTIVE</div>
    </div>
    <div class="kpi kpi-amber">
      <div class="kpi-label">Mode</div>
      <div class="kpi-val" style="font-size:16px">Semi-Auto</div>
    </div>
  `;
}

async function loadStats() {
  // Show stale cached data immediately (avoids blank screen on revisit)
  try {
    const raw = sessionStorage.getItem(CACHE_KEY);
    if (raw) {
      const { data, ts } = JSON.parse(raw);
      if (Date.now() - ts < CACHE_TTL_MS) {
        renderStats(data, false);
        return; // fresh enough — no network call needed
      }
      renderStats(data, true); // show stale while refreshing in background
    }
  } catch (_) {}

  try {
    const token = localStorage.getItem('access_token') || localStorage.getItem('bh_token') || '';
    const headers = token ? { Authorization: `Bearer ${token}` } : {};
    const res = await fetch('/approval/stats', { headers });
    if (!res.ok) throw new Error(res.status);
    const json = await res.json();
    const data = json.ok ? json : json.data || json;
    renderStats(data, false);
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ data, ts: Date.now() })); } catch (_) {}
  } catch (e) {
    console.warn('Dashboard stats load failed:', e);
  }
}

loadStats();
</script>
</body>
</html>
