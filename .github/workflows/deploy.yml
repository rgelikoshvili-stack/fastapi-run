name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: fastapi-run
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGION: europe-west1
  SERVICE_URL: https://fastapi-run-226875230147.europe-west1.run.app

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app tests main.py

      - name: Run unit tests
        env:
          JWT_SECRET: test-secret-ci-32-bytes-minimum-key
          TEST_MODE: "1"
          DATABASE_URL: ""
        run: python -m pytest tests/unit/ -v --tb=short --ignore=tests/unit/test_document_upload.py -q

      - name: Run integration smoke tests
        env:
          JWT_SECRET: test-secret-ci-32-bytes-minimum-key
          TEST_MODE: "1"
          DATABASE_URL: ""
        run: python -m pytest tests/integration/test_invoice_ocr_fallback.py --tb=short -q

  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Skip if React app is not present
        id: react_app
        shell: bash
        run: |
          if [ -f bridge-hub-ui/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "bridge-hub-ui is not present in this backend-only tree; skipping frontend build."
          fi

      - name: Set up Node
        if: steps.react_app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bridge-hub-ui/package-lock.json

      - name: Install frontend dependencies
        if: steps.react_app.outputs.present == 'true'
        working-directory: bridge-hub-ui
        run: npm ci

      - name: Build frontend
        if: steps.react_app.outputs.present == 'true'
        working-directory: bridge-hub-ui
        run: npm run build

  deploy:
    needs: [test, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "GCP_SA_KEY secret is not set. Add it in GitHub > Settings > Secrets > Actions."
            exit 1
          fi
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "GCP_PROJECT_ID secret is not set."
            exit 1
          fi
          echo "Secrets present"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Prepare deployment metadata
        shell: bash
        run: |
          echo "COMMIT_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "ENVIRONMENT=production" >> "$GITHUB_ENV"

      - name: Set up Python for migrations
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for migrations
        run: pip install -r requirements.txt

      - name: Validate migration plan (dry-run)
        # Validates all migration module imports and prints the execution plan.
        # Live migrations run at app startup (run_db_migrations via lifespan).
        # To promote to a live pre-deploy step, add Cloud SQL Auth Proxy here
        # and set DATABASE_URL in GitHub Actions secrets.
        run: python scripts/migrate.py --dry-run

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 4 \
            --memory 2Gi \
            --cpu 2 \
            --concurrency 100 \
            --timeout 300 \
            --update-env-vars "COMMIT_SHA=${COMMIT_SHA},BUILD_TIME=${BUILD_TIME},ENVIRONMENT=${ENVIRONMENT}" \
            --remove-env-vars "DATABASE_URL,JWT_SECRET,ANTHROPIC_API_KEY,OPENROUTER_API_KEY,VAULT_ENCRYPTION_KEY" \
            --update-secrets "DATABASE_URL=bridge-hub-database-url:latest,JWT_SECRET=bridge-hub-jwt-secret:latest,ANTHROPIC_API_KEY=bridge-hub-anthropic-api-key:latest,OPENROUTER_API_KEY=bridge-hub-openrouter-api-key:latest,VAULT_ENCRYPTION_KEY=bridge-hub-vault-encryption-key:latest" \
            --quiet

      - name: Smoke test - health check
        run: |
          echo "Checking: ${{ env.SERVICE_URL }}/health"
          BODY=$(curl -s \
            --retry 5 --retry-delay 5 --retry-connrefused \
            "${{ env.SERVICE_URL }}/health")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ env.SERVICE_URL }}/health")
          echo "HTTP status: $STATUS"
          echo "Response body: $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "Health check FAILED (HTTP $STATUS)" && exit 1
          fi
          if ! echo "$BODY" | grep -q '"ok":true'; then
            echo "Health check returned ok:false; liveness probe must return ok:true"
            exit 1
          fi
          echo "Health check PASSED (HTTP $STATUS, ok:true)"

      - name: Smoke test - version check
        run: |
          echo "Checking: ${{ env.SERVICE_URL }}/version"
          BODY=$(curl -s \
            --retry 5 --retry-delay 5 --retry-connrefused \
            "${{ env.SERVICE_URL }}/version")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ env.SERVICE_URL }}/version")
          echo "HTTP status: $STATUS"
          echo "Response body: $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "Version check FAILED (HTTP $STATUS)" && exit 1
          fi
          if ! echo "$BODY" | grep -q '"ok":true'; then
            echo "Version check returned ok:false"
            exit 1
          fi
          if ! echo "$BODY" | grep -q "\"commit_sha\":\"$COMMIT_SHA\""; then
            echo "Version check missing commit_sha $COMMIT_SHA"
            exit 1
          fi
          if ! echo "$BODY" | grep -q "\"build_time\":\"$BUILD_TIME\""; then
            echo "Version check missing build_time $BUILD_TIME"
            exit 1
          fi
          if ! echo "$BODY" | grep -q "\"environment\":\"$ENVIRONMENT\""; then
            echo "Version check missing environment $ENVIRONMENT"
            exit 1
          fi
          echo "Version check PASSED (HTTP $STATUS, deployment metadata verified)"
